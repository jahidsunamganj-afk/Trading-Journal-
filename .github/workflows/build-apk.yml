        run: |
          cat > app/src/main/java/com/tradingmaster/app/MainActivity.kt <<'MAIN_EOF'
          package com.tradingmaster.app

          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.text.InputType
          import android.view.Gravity
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import com.google.android.material.card.MaterialCardView
          import com.google.android.material.floatingactionbutton.ExtendedFloatingActionButton
          import java.text.SimpleDateFormat
          import java.util.*

          class MainActivity : AppCompatActivity() {
              private lateinit var contentArea: FrameLayout
              private lateinit var navBtns: MutableList<LinearLayout>
              private var tab = 0
              private val addLauncher = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { showTab(tab) }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  buildShell()
                  showTab(0)
              }

              override fun onResume() { super.onResume(); if (::contentArea.isInitialized) showTab(tab) }

              private fun buildShell() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#F8FAFC"))
                  }
                  contentArea = FrameLayout(this).apply {
                      layoutParams = LinearLayout.LayoutParams(-1, 0, 1f)
                  }
                  val nav = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(Color.WHITE)
                      elevation = 20f
                      setPadding(0, 12, 0, 12)
                      layoutParams = LinearLayout.LayoutParams(-1, -2)
                  }
                  navBtns = mutableListOf()
                  val items = listOf("🏠" to "হোম", "📚" to "শিখুন", "📊" to "জার্নাল", "🧮" to "টুলস", "☰" to "আরও")
                  items.forEachIndexed { idx, pair ->
                      val btn = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          gravity = Gravity.CENTER
                          layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                          setOnClickListener { showTab(idx) }
                      }
                      btn.addView(TextView(this).apply {
                          text = pair.first; textSize = 22f; gravity = Gravity.CENTER; tag = "icon"
                      })
                      btn.addView(TextView(this).apply {
                          text = pair.second; textSize = 11f; gravity = Gravity.CENTER
                          setPadding(0, 4, 0, 0); tag = "label"
                      })
                      navBtns.add(btn)
                      nav.addView(btn)
                  }
                  root.addView(contentArea)
                  root.addView(nav)
                  setContentView(root)
              }

              private fun showTab(idx: Int) {
                  tab = idx
                  contentArea.removeAllViews()
                  navBtns.forEachIndexed { i, b ->
                      val on = i == idx
                      b.findViewWithTag<TextView>("icon")?.alpha = if (on) 1f else 0.5f
                      b.findViewWithTag<TextView>("label")?.let {
                          it.setTextColor(Color.parseColor(if (on) "#6366F1" else "#94A3B8"))
                          it.setTypeface(null, if (on) Typeface.BOLD else Typeface.NORMAL)
                      }
                  }
                  when (idx) {
                      0 -> contentArea.addView(buildHome())
                      1 -> contentArea.addView(buildLearn())
                      2 -> contentArea.addView(buildJournal())
                      3 -> contentArea.addView(buildTools())
                      4 -> contentArea.addView(buildMore())
                  }
              }

              private fun buildHome(): ScrollView {
                  val sv = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#F8FAFC")) }
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(32, 48, 32, 32)
                  }
                  val trades = TradeStore(this).all()
                  val cs = ChecklistStore(this)
                  val lp = LessonProgressStore(this)
                  val pnl = Stats.totalPnl(trades)
                  val wr = Stats.winRate(trades)

                  col.addView(TextView(this).apply {
                      text = "স্বাগতম"; textSize = 13f; setTextColor(Color.parseColor("#64748B"))
                  })
                  col.addView(TextView(this).apply {
                      text = "Trading Master"; textSize = 26f
                      setTextColor(Color.parseColor("#0F172A"))
                      setTypeface(typeface, Typeface.BOLD); setPadding(0, 4, 0, 20)
                  })

                  val hero = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 32, 40, 32)
