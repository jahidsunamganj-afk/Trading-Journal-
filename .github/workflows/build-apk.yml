                  dailyItems.forEach { item ->
                      val c = cs.isChecked(item.id)
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                          setPadding(0, 12, 0, 4)
                          setOnClickListener { cs.setChecked(item.id, !c); showTab(0) }
                      }
                      row.addView(TextView(this).apply {
                          text = if (c) "[x]" else "[ ]"; textSize = 14f
                          setTextColor(Color.parseColor(if (c) "#10B981" else "#94A3B8"))
                          setPadding(0, 0, 14, 0)
                          setTypeface(typeface, Typeface.BOLD)
                      })
                      row.addView(TextView(this).apply {
                          text = item.text; textSize = 13f
                          setTextColor(Color.parseColor(if (c) "#94A3B8" else "#0F172A"))
