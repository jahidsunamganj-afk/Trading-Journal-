              private fun showPositionCalc() {
                  val d = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(40, 16, 40, 0) }
                  val bal = inputField("ব্যালেন্স").apply { setText("1000") }
                  val rp = inputField("রিস্ক %").apply { setText("2") }
                  val en = inputField("এন্ট্রি")
                  val sl = inputField("স্টপ লস")
                  val res = TextView(this).apply {
                      text = "ফলাফল এখানে"; textSize = 14f
                      setTextColor(Color.parseColor("#6366F1")); setTypeface(typeface, Typeface.BOLD)
                      setPadding(0, 16, 0, 8)
                  }
                  d.addView(lbl("ব্যালেন্স")); d.addView(bal)
                  d.addView(lbl("রিস্ক %")); d.addView(rp)
                  d.addView(lbl("এন্ট্রি")); d.addView(en)
                  d.addView(lbl("স্টপ লস")); d.addView(sl)
                  d.addView(res)
                  AlertDialog.Builder(this).setTitle("পজিশন সাইজ").setView(d)
                      .setPositiveButton("হিসাব") { _, _ ->
                          try {
                              val b = bal.text.toString().toDouble()
                              val r = rp.text.toString().toDouble()/100
                              val e = en.text.toString().toDouble()
                              val s = sl.text.toString().toDouble()
                              val diff = Math.abs(e-s)
                              if (diff==0.0) return@setPositiveButton
                              val riskAmt = b*r
                              val posSize = riskAmt/diff
                              res.text = "রিস্ক: " + String.format(Locale.US,"%.2f",riskAmt) + "\nপজিশন: " + String.format(Locale.US,"%.4f",posSize)
                          } catch (ex: Exception) { res.text = "সব ফিল্ড পূরণ করুন" }
                      }.setNegativeButton("বন্ধ", null).show()
              }

              private fun showRRCalc() {
                  val d = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(40, 16, 40, 0) }
                  val en = inputField("এন্ট্রি"); val sl = inputField("স্টপ লস"); val tp = inputField("টেক প্রফিট")
                  val res = TextView(this).apply {
                      text = "ফলাফল"; textSize = 14f; setTextColor(Color.parseColor("#10B981"))
                      setTypeface(typeface, Typeface.BOLD); setPadding(0, 16, 0, 8)
                  }
                  d.addView(lbl("এন্ট্রি")); d.addView(en)
                  d.addView(lbl("স্টপ লস")); d.addView(sl)
                  d.addView(lbl("টেক প্রফিট")); d.addView(tp)
                  d.addView(res)
                  AlertDialog.Builder(this).setTitle("R:R ক্যালকুলেটর").setView(d)
                      .setPositiveButton("হিসাব") { _, _ ->
                          try {
                              val e = en.text.toString().toDouble()
                              val s = sl.text.toString().toDouble()
                              val t = tp.text.toString().toDouble()
                              val r = Math.abs(e-s); val w = Math.abs(t-e)
                              if (r==0.0) return@setPositiveButton
                              res.text = "রিস্ক: " + String.format(Locale.US,"%.2f",r) + "\nরিওয়ার্ড: " + String.format(Locale.US,"%.2f",w) + "\nR:R = 1:" + String.format(Locale.US,"%.2f",w/r)
                          } catch (ex: Exception) { res.text = "সব ফিল্ড পূরণ করুন" }
                      }.setNegativeButton("বন্ধ", null).show()
              }

              private fun showPipCalc() {
                  val d = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(40, 16, 40, 0) }
                  val lot = inputField("লট সাইজ").apply { setText("1") }
                  val res = TextView(this).apply {
                      text = "স্ট্যান্ডার্ড লটে প্রতি পিপ ১০ ডলার"; textSize = 13f
                      setTextColor(Color.parseColor("#F59E0B")); setPadding(0, 16, 0, 8)
                  }
                  d.addView(lbl("লট সাইজ")); d.addView(lot); d.addView(res)
                  AlertDialog.Builder(this).setTitle("পিপ ভ্যালু").setView(d)
                      .setPositiveButton("হিসাব") { _, _ ->
                          try { res.text = "প্রতি পিপ: " + String.format(Locale.US,"%.2f",lot.text.toString().toDouble()*10) }
                          catch (ex: Exception) { res.text = "সঠিক মান দিন" }
                      }.setNegativeButton("বন্ধ", null).show()
              }

              private fun showCompoundCalc() {
                  val d = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(40, 16, 40, 0) }
                  val start = inputField("শুরু ব্যালেন্স").apply { setText("1000") }
                  val rate = inputField("মাসিক রিটার্ন %").apply { setText("10") }
                  val months = inputField("মাস").apply { setText("12") }
                  val res = TextView(this).apply {
                      text = "ফলাফল"; textSize = 14f; setTextColor(Color.parseColor("#8B5CF6"))
                      setTypeface(typeface, Typeface.BOLD); setPadding(0, 16, 0, 8)
                  }
                  d.addView(lbl("শুরু ব্যালেন্স")); d.addView(start)
                  d.addView(lbl("মাসিক রিটার্ন %")); d.addView(rate)
                  d.addView(lbl("মাস")); d.addView(months); d.addView(res)
                  AlertDialog.Builder(this).setTitle("কম্পাউন্ড").setView(d)
                      .setPositiveButton("হিসাব") { _, _ ->
                          try {
                              val s = start.text.toString().toDouble()
                              val r = rate.text.toString().toDouble()/100
                              val m = months.text.toString().toInt()
                              var f = s
                              for (i in 1..m) f *= (1+r)
                              res.text = "চূড়ান্ত: " + String.format(Locale.US,"%.2f",f) + "\nলাভ: " + String.format(Locale.US,"%.2f",f-s)
                          } catch (ex: Exception) { res.text = "সব ফিল্ড পূরণ করুন" }
                      }.setNegativeButton("বন্ধ", null).show()
              }

              private fun showDrawdownCalc() {
                  val d = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(40, 16, 40, 0) }
                  val peak = inputField("পিক ব্যালেন্স").apply { setText("1000") }
                  val now = inputField("বর্তমান ব্যালেন্স").apply { setText("800") }
                  val res = TextView(this).apply {
                      text = "ফলাফল"; textSize = 14f; setTextColor(Color.parseColor("#EF4444"))
                      setTypeface(typeface, Typeface.BOLD); setPadding(0, 16, 0, 8)
                  }
                  d.addView(lbl("পিক")); d.addView(peak)
                  d.addView(lbl("বর্তমান")); d.addView(now); d.addView(res)
                  AlertDialog.Builder(this).setTitle("ড্রডাউন").setView(d)
                      .setPositiveButton("হিসাব") { _, _ ->
                          try {
                              val p = peak.text.toString().toDouble()
                              val n = now.text.toString().toDouble()
                              val dd = ((p-n)/p)*100
                              val recover = if (dd<100) (dd/(100-dd))*100 else 0.0
                              res.text = "ড্রডাউন: " + String.format(Locale.US,"%.2f",dd) + "%\nপুনরুদ্ধারে দরকার: " + String.format(Locale.US,"%.2f",recover) + "%"
                          } catch (ex: Exception) { res.text = "সঠিক মান দিন" }
                      }.setNegativeButton("বন্ধ", null).show()
              }

              private fun buildMore(): ScrollView {
                  val sv = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#F8FAFC")) }
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(32, 48, 32, 32)
                  }
                  col.addView(TextView(this).apply {
                      text = "আরও"; textSize = 26f
                      setTextColor(Color.parseColor("#0F172A"))
                      setTypeface(typeface, Typeface.BOLD); setPadding(0, 0, 0, 20)
                  })
                  col.addView(sectionHeader("বিশ্লেষণ"))
                  col.addView(toolCard("📈","অ্যানালিটিক্স","ইকুইটি কার্ভ, উইন রেট, স্ট্যাটস","#6366F1") {
                      startActivity(Intent(this@MainActivity, AnalyticsActivity::class.java))
                  })
                  col.addView(sectionHeader("চেকলিস্ট"))
                  col.addView(toolCard("✅","প্রি-ট্রেড চেকলিস্ট","ট্রেডের আগে যা চেক করবেন","#10B981") {
                      showChecklist("pretrade", "প্রি-ট্রেড চেকলিস্ট")
                  })
                  col.addView(sectionHeader("স্ট্রাটেজি"))
                  col.addView(toolCard("🎯","আমার স্ট্রাটেজি","নিজের স্ট্রাটেজি সেভ","#8B5CF6") {
                      showStrategies()
                  })
                  col.addView(sectionHeader("ডেটা"))
                  col.addView(toolCard("☁️","ডেটা এক্সপোর্ট","CSV/JSON/Drive সেভ","#3B82F6") {
                      startActivity(Intent(this@MainActivity, SettingsActivity::class.java))
                  })
                  col.addView(sectionHeader("সম্পর্কে"))
                  col.addView(toolCard("ℹ️","Trading Master v1.0","সবকিছু এক অ্যাপে","#EC4899") {
                      AlertDialog.Builder(this).setTitle("Trading Master")
                          .setMessage("একজন ট্রেডারের সম্পূর্ণ সঙ্গী। শিখুন, ট্রেড করুন, জার্নাল রাখুন।\n\nসংস্করণ: 1.0")
                          .setPositiveButton("ঠিক আছে", null).show()
                  })
                  sv.addView(col); return sv
              }

              private fun sectionHeader(t: String) = TextView(this).apply {
                  text = t; textSize = 12f
                  setTextColor(Color.parseColor("#64748B"))
                  setTypeface(typeface, Typeface.BOLD)
                  setPadding(8, 20, 8, 10); letterSpacing = 0.05f
              }

              private fun showChecklist(cat: String, title: String) {
                  val items = Content.checklistItems.filter { it.category == cat }
                  val cs = ChecklistStore(this)
                  val d = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(32, 16, 32, 0) }
                  items.forEach { item ->
                      val cb = CheckBox(this).apply {
                          text = item.text; textSize = 14f
                          setTextColor(Color.parseColor("#0F172A"))
                          isChecked = cs.isChecked(item.id)
                          setOnCheckedChangeListener { _, v -> cs.setChecked(item.id, v) }
                          setPadding(0, 10, 0, 10)
                      }
                      d.addView(cb)
                  }
                  AlertDialog.Builder(this).setTitle(title).setView(ScrollView(this).apply { addView(d) })
                      .setPositiveButton("ঠিক আছে", null).show()
              }

              private fun showStrategies() {
                  val ss = StrategyStore(this)
                  val d = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(32, 8, 32, 0) }
                  val list = ss.all()
                  if (list.isEmpty()) {
                      d.addView(TextView(this).apply {
                          text = "এখনো কোনো স্ট্রাটেজি নেই\nনিচের বাটনে যোগ করুন"
                          textSize = 13f; setTextColor(Color.parseColor("#94A3B8"))
                          gravity = Gravity.CENTER; setPadding(0, 60, 0, 60)
                      })
                  } else {
                      list.forEach { s ->
                          val card = MaterialCardView(this).apply {
                              radius = 16f; cardElevation = 1f
                              setCardBackgroundColor(Color.parseColor("#F8FAFC"))
                              strokeWidth = 1; strokeColor = Color.parseColor("#E2E8F0")
                              layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 8 }
                          }
                          val inner = LinearLayout(this).apply {
                              orientation = LinearLayout.VERTICAL; setPadding(20, 16, 20, 16)
                          }
                          inner.addView(TextView(this).apply {
                              text = s.name; textSize = 14f; setTextColor(Color.parseColor("#0F172A"))
                              setTypeface(typeface, Typeface.BOLD)
                          })
                          if (s.description.isNotBlank()) inner.addView(TextView(this).apply {
                              text = s.description; textSize = 12f; setTextColor(Color.parseColor("#64748B"))
                              setPadding(0, 4, 0, 0)
                          })
                          card.addView(inner)
                          card.setOnClickListener {
                              AlertDialog.Builder(this).setTitle(s.name)
                                  .setMessage("এন্ট্রি:\n${s.entryRules}\n\nএক্সিট:\n${s.exitRules}\n\nটাইমফ্রেম: ${s.timeframe}")
                                  .setPositiveButton("বন্ধ", null)
                                  .setNegativeButton("মুছুন") { _, _ -> ss.remove(s.id); showStrategies() }.show()
                          }
                          d.addView(card)
                      }
                  }
                  AlertDialog.Builder(this).setTitle("আমার স্ট্রাটেজি")
                      .setView(ScrollView(this).apply { addView(d) })
                      .setPositiveButton("+ নতুন") { _, _ -> showAddStrategy() }
                      .setNegativeButton("বন্ধ", null).show()
              }

              private fun showAddStrategy() {
                  val d = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(40, 16, 40, 0) }
                  val name = EditText(this).apply { hint = "স্ট্রাটেজির নাম"; setBackgroundColor(Color.parseColor("#F1F5F9")); setPadding(28, 22, 28, 22); textSize = 14f; layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 10 } }
                  val desc = EditText(this).apply { hint = "বর্ণনা"; setBackgroundColor(Color.parseColor("#F1F5F9")); setPadding(28, 22, 28, 22); textSize = 14f; layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 10 } }
                  val entryR = EditText(this).apply { hint = "এন্ট্রি রুলস"; setBackgroundColor(Color.parseColor("#F1F5F9")); setPadding(28, 22, 28, 22); textSize = 14f; layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 10 } }
                  val exitR = EditText(this).apply { hint = "এক্সিট রুলস"; setBackgroundColor(Color.parseColor("#F1F5F9")); setPadding(28, 22, 28, 22); textSize = 14f; layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 10 } }
                  val tf = EditText(this).apply { hint = "টাইমফ্রেম"; setBackgroundColor(Color.parseColor("#F1F5F9")); setPadding(28, 22, 28, 22); textSize = 14f; layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 10 } }
                  d.addView(name); d.addView(desc); d.addView(entryR); d.addView(exitR); d.addView(tf)
                  AlertDialog.Builder(this).setTitle("নতুন স্ট্রাটেজি")
                      .setView(ScrollView(this).apply { addView(d) })
                      .setPositiveButton("সেভ") { _, _ ->
                          if (name.text.isNotBlank()) {
                              StrategyStore(this).add(Strategy(
                                  name = name.text.toString(), description = desc.text.toString(),
                                  entryRules = entryR.text.toString(), exitRules = exitR.text.toString(),
                                  timeframe = tf.text.toString()
                              ))
                              Toast.makeText(this, "সেভ হয়েছে", Toast.LENGTH_SHORT).show()
                          }
                      }.setNegativeButton("বাতিল", null).show()
              }
          }
          MAIN_EOF

      - name: Write Analytics
        run: |
          cat > app/src/main/java/com/tradingmaster/app/AnalyticsActivity.kt <<'AN_EOF'
          package com.tradingmaster.app

          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import com.google.android.material.card.MaterialCardView
          import java.util.*

          class AnalyticsActivity : AppCompatActivity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val sv = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#F8FAFC")) }
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(32, 48, 32, 32)
                  }
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, 0, 0, 20)
                  }
                  header.addView(TextView(this).apply {
                      text = "<"; textSize = 26f; setPadding(0, 0, 16, 4)
                      setTextColor(Color.parseColor("#0F172A"))
                      setOnClickListener { finish() }
                  })
                  header.addView(TextView(this).apply {
                      text = "অ্যানালিটিক্স"; textSize = 22f
                      setTextColor(Color.parseColor("#0F172A"))
                      setTypeface(typeface, Typeface.BOLD)
                  })
                  col.addView(header)

                  val trades = TradeStore(this).all()
                  val pnl = Stats.totalPnl(trades)
                  val wr = Stats.winRate(trades)
                  val pf = Stats.profitFactor(trades)
                  val pnlSign = if (pnl>=0) "+" else "-"
                  val pnlStr = pnlSign + String.format(Locale.US,"%.2f",Math.abs(pnl))
                  val pfStr = if (pf>99) "99+" else String.format(Locale.US,"%.2f",pf)

                  val row1 = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  row1.addView(statCard("মোট P&L", pnlStr, if (pnl>=0) "#10B981" else "#EF4444"))
                  row1.addView(statCard("উইন রেট", String.format(Locale.US,"%.1f",wr)+"%", "#3B82F6"))
                  col.addView(row1)

                  val row2 = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  row2.addView(statCard("প্রফিট ফ্যাক্টর", pfStr, "#F59E0B"))
                  row2.addView(statCard("মোট ট্রেড", "${trades.size}", "#8B5CF6"))
                  col.addView(row2)

                  col.addView(TextView(this).apply {
                      text = "ইকুইটি কার্ভ"; textSize = 15f
                      setTextColor(Color.parseColor("#0F172A"))
                      setTypeface(typeface, Typeface.BOLD); setPadding(8, 20, 0, 10)
                  })
                  val chartCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = GradientDrawable().apply {
                          cornerRadius = 32f; setColor(Color.WHITE)
                          setStroke(2, Color.parseColor("#E2E8F0"))
                      }
                      setPadding(28, 28, 28, 28)
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 16 }
                  }
                  val chart = EquityChartView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(-1, 380)
                  }
                  chart.setData(Stats.equityCurve(trades))
                  chartCard.addView(chart)
                  col.addView(chartCard)

                  val bp = Stats.bestPair(trades); val wp = Stats.worstPair(trades)
                  if (bp.first.isNotBlank()) {
                      col.addView(TextView(this).apply {
                          text = "পেয়ার পারফরম্যান্স"; textSize = 15f
                          setTextColor(Color.parseColor("#0F172A"))
                          setTypeface(typeface, Typeface.BOLD); setPadding(8, 12, 0, 10)
                      })
                      col.addView(pairCard("সেরা", bp.first, bp.second, "#10B981"))
                      if (wp.first.isNotBlank() && wp.first != bp.first) {
                          col.addView(pairCard("সবচেয়ে খারাপ", wp.first, wp.second, "#EF4444"))
                      }
                  }
                  sv.addView(col); setContentView(sv)
              }

              private fun statCard(label: String, value: String, colorHex: String): MaterialCardView {
                  val c = MaterialCardView(this).apply {
                      radius = 24f; cardElevation = 3f
                      setCardBackgroundColor(Color.WHITE)
                      strokeWidth = 2; strokeColor = Color.parseColor("#E2E8F0")
                      layoutParams = LinearLayout.LayoutParams(0, -2).apply {
                          weight = 1f; setMargins(6, 6, 6, 6)
                      }
                  }
                  val i = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(24, 20, 24, 20)
                  }
                  i.addView(LinearLayout(this).apply {
                      background = GradientDrawable().apply { cornerRadius = 8f; setColor(Color.parseColor(colorHex)) }
                      layoutParams = LinearLayout.LayoutParams(36, 8).apply { bottomMargin = 10 }
                  })
                  i.addView(TextView(this).apply {
                      text = value; textSize = 18f
                      setTextColor(Color.parseColor("#0F172A"))
                      setTypeface(typeface, Typeface.BOLD)
                  })
                  i.addView(TextView(this).apply {
                      text = label; textSize = 11f; setTextColor(Color.parseColor("#64748B")); setPadding(0, 4, 0, 0)
                  })
                  c.addView(i); return c
              }

              private fun pairCard(tag: String, pair: String, pnl: Double, colorHex: String): MaterialCardView {
                  val c = MaterialCardView(this).apply {
                      radius = 20f; cardElevation = 2f
                      setCardBackgroundColor(Color.WHITE)
                      strokeWidth = 2; strokeColor = Color.parseColor("#E2E8F0")
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 10 }
                  }
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      setPadding(24, 20, 24, 20)
                  }
                  row.addView(LinearLayout(this).apply {
                      background = GradientDrawable().apply { cornerRadius = 8f; setColor(Color.parseColor(colorHex)) }
                      layoutParams = LinearLayout.LayoutParams(8, 48).apply { rightMargin = 16 }
                  })
                  val info = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                  }
                  info.addView(TextView(this).apply {
                      text = tag; textSize = 11f; setTextColor(Color.parseColor("#64748B"))
                  })
                  info.addView(TextView(this).apply {
                      text = pair; textSize = 15f
                      setTextColor(Color.parseColor("#0F172A")); setTypeface(typeface, Typeface.BOLD)
                  })
                  row.addView(info)
                  val pnlText = (if (pnl>=0) "+" else "-") + String.format(Locale.US,"%.2f",Math.abs(pnl))
                  row.addView(TextView(this).apply {
                      text = pnlText
                      textSize = 15f; setTextColor(Color.parseColor(colorHex))
                      setTypeface(typeface, Typeface.BOLD)
                  })
                  c.addView(row); return c
              }
          }
          AN_EOF

