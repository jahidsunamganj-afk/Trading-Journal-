              private fun tradeRow(t: Trade): MaterialCardView {
                  val win = t.pnl >= 0
                  val card = MaterialCardView(this).apply {
                      radius = 28f; cardElevation = 2f
                      setCardBackgroundColor(Color.WHITE)
                      strokeWidth = 1; strokeColor = Color.parseColor("#E2E8F0")
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 12 }
                      isClickable = true; isFocusable = true
                      setOnClickListener { showTradeDialog(t) }
                  }
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      setPadding(28, 24, 28, 24)
                  }
                  val iconBox = LinearLayout(this).apply {
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.parseColor(if (win) "#DCFCE7" else "#FEE2E2"))
                      }
                      layoutParams = LinearLayout.LayoutParams(84, 84).apply { rightMargin = 20 }
                      gravity = Gravity.CENTER
                      addView(TextView(this@MainActivity).apply {
                          text = if (win) "+" else "-"; textSize = 32f
                          setTextColor(Color.parseColor(if (win) "#10B981" else "#EF4444"))
                          setTypeface(typeface, Typeface.BOLD); gravity = Gravity.CENTER
                      })
                  }
                  row.addView(iconBox)
                  val info = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                  }
                  info.addView(TextView(this).apply {
                      text = "${t.pair} · ${t.direction}"; textSize = 15f
                      setTextColor(Color.parseColor("#0F172A"))
                      setTypeface(typeface, Typeface.BOLD)
                  })
                  info.addView(TextView(this).apply {
                      text = SimpleDateFormat("dd MMM yyyy", Locale.getDefault()).format(Date(t.date))
                      textSize = 11f; setTextColor(Color.parseColor("#64748B")); setPadding(0, 4, 0, 0)
                  })
                  if (t.strategy.isNotBlank()) {
                      info.addView(TextView(this).apply {
                          text = t.strategy; textSize = 11f
                          setTextColor(Color.parseColor("#6366F1")); setPadding(0, 2, 0, 0)
                      })
                  }
                  row.addView(info)
                  val pnlText = (if (win) "+" else "-") + String.format(Locale.US,"%.2f",Math.abs(t.pnl))
                  row.addView(TextView(this).apply {
                      text = pnlText
                      textSize = 14f
                      setTextColor(Color.parseColor(if (win) "#10B981" else "#EF4444"))
                      setTypeface(typeface, Typeface.BOLD)
                  })
                  card.addView(row); return card
              }

              private fun showTradeDialog(t: Trade) {
                  val dlg = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(40, 24, 40, 0)
                  }
                  fun lbl(l:String, v:String) {
                      dlg.addView(TextView(this).apply { text=l; textSize=11f; setTextColor(Color.parseColor("#64748B")); setPadding(0,10,0,2) })
                      dlg.addView(TextView(this).apply { text=v; textSize=14f; setTextColor(Color.parseColor("#0F172A")); setTypeface(typeface,Typeface.BOLD) })
                  }
                  lbl("পেয়ার", t.pair); lbl("ডিরেকশন", t.direction)
                  lbl("এন্ট্রি থেকে এক্সিট", "${t.entry} থেকে ${t.exit}")
                  val pnlVal = (if (t.pnl>=0) "+" else "") + String.format(Locale.US,"%.2f",t.pnl)
                  lbl("P&L", pnlVal)
                  if (t.strategy.isNotBlank()) lbl("স্ট্রাটেজি", t.strategy)
                  if (t.session.isNotBlank()) lbl("সেশন", t.session)
                  if (t.emotion.isNotBlank()) lbl("ইমোশন", t.emotion)
                  if (t.notes.isNotBlank()) lbl("নোট", t.notes)
                  AlertDialog.Builder(this).setTitle("ট্রেড বিস্তারিত").setView(ScrollView(this).apply { addView(dlg) })
                      .setPositiveButton("বন্ধ", null)
                      .setNegativeButton("মুছুন") { _, _ -> TradeStore(this).remove(t.id); showTab(2) }
                      .show()
              }

