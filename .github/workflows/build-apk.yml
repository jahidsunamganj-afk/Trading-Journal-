      - name: Write AddTrade
        run: |
          cat > app/src/main/java/com/tradingmaster/app/AddTradeActivity.kt <<'AT_EOF'
          package com.tradingmaster.app

          import android.app.DatePickerDialog
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.text.InputType
          import android.view.Gravity
          import android.widget.*
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import java.text.SimpleDateFormat
          import java.util.*

          class AddTradeActivity : AppCompatActivity() {
              private var direction = "LONG"
              private var session = "Asia"
              private var emotion = "Calm"
              private var selectedDate = System.currentTimeMillis()
              private lateinit var longBtn: TextView
              private lateinit var shortBtn: TextView
              private lateinit var dateLabel: TextView
              private lateinit var sessionLabel: TextView
              private lateinit var emotionLabel: TextView

              override fun onCreate(b: Bundle?) { super.onCreate(b); buildUi() }

              private fun buildUi() {
                  val sv = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#F8FAFC")) }
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(32, 48, 32, 32)
                  }
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, 0, 0, 24)
                  }
                  header.addView(TextView(this).apply {
                      text = "<"; textSize = 26f; setPadding(0, 0, 16, 4)
                      setTextColor(Color.parseColor("#0F172A"))
                      setOnClickListener { finish() }
                  })
                  header.addView(TextView(this).apply {
                      text = "নতুন ট্রেড"; textSize = 22f
                      setTextColor(Color.parseColor("#0F172A"))
                      setTypeface(typeface, Typeface.BOLD)
                  })
                  val form = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = GradientDrawable().apply {
                          cornerRadius = 32f; setColor(Color.WHITE)
                          setStroke(2, Color.parseColor("#E2E8F0"))
                      }
                      setPadding(32, 28, 32, 28); elevation = 3f
                  }
                  fun lbl(t: String) = TextView(this).apply {
                      text = t; textSize = 12f; setTextColor(Color.parseColor("#0F172A"))
                      setTypeface(typeface, Typeface.BOLD); setPadding(0, 16, 0, 8)
                  }
                  fun inp(h: String, t: Int = InputType.TYPE_CLASS_TEXT) = EditText(this).apply {
                      hint = h; inputType = t
                      setBackgroundColor(Color.parseColor("#F1F5F9"))
                      setPadding(24, 20, 24, 20); textSize = 14f
                  }
                  fun selector(hint: String, onClick: () -> Unit) = TextView(this).apply {
                      text = hint; textSize = 14f; setTextColor(Color.parseColor("#0F172A"))
                      background = GradientDrawable().apply { cornerRadius = 12f; setColor(Color.parseColor("#F1F5F9")) }
                      setPadding(24, 20, 24, 20)
                      setOnClickListener { onClick() }
                  }

                  form.addView(lbl("পেয়ার")); val etPair = inp("BTC/USDT"); form.addView(etPair)
                  form.addView(lbl("ডিরেকশন"))
                  val dirRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  longBtn = makeDirBtn("LONG", true); shortBtn = makeDirBtn("SHORT", false)
                  longBtn.setOnClickListener { setDirection("LONG") }
                  shortBtn.setOnClickListener { setDirection("SHORT") }
                  dirRow.addView(longBtn, LinearLayout.LayoutParams(0, -2, 1f).apply { setMargins(0, 0, 6, 0) })
                  dirRow.addView(shortBtn, LinearLayout.LayoutParams(0, -2, 1f).apply { setMargins(6, 0, 0, 0) })
                  form.addView(dirRow)
                  form.addView(lbl("এন্ট্রি"))
                  val etEntry = inp("0.00", InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL); form.addView(etEntry)
                  form.addView(lbl("এক্সিট"))
                  val etExit = inp("0.00", InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL); form.addView(etExit)
                  form.addView(lbl("কোয়ান্টিটি"))
                  val etQty = inp("0.00", InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL); form.addView(etQty)
                  form.addView(lbl("তারিখ"))
                  dateLabel = selector(SimpleDateFormat("dd MMM yyyy", Locale.getDefault()).format(Date(selectedDate))) {
                      val cal = Calendar.getInstance().apply { timeInMillis = selectedDate }
                      DatePickerDialog(this@AddTradeActivity, { _, y, m, d ->
                          cal.set(y, m, d); selectedDate = cal.timeInMillis
                          dateLabel.text = SimpleDateFormat("dd MMM yyyy", Locale.getDefault()).format(Date(selectedDate))
                      }, cal.get(Calendar.YEAR), cal.get(Calendar.MONTH), cal.get(Calendar.DAY_OF_MONTH)).show()
                  }
                  form.addView(dateLabel)
                  form.addView(lbl("সেশন"))
                  sessionLabel = selector("Asia") {
                      val opts = arrayOf("Asia", "London", "New York", "Overlap")
                      AlertDialog.Builder(this@AddTradeActivity).setTitle("সেশন")
                          .setItems(opts) { _, i -> session = opts[i]; sessionLabel.text = session }.show()
                  }
                  form.addView(sessionLabel)
                  form.addView(lbl("ইমোশন"))
                  emotionLabel = selector("Calm") {
                      val opts = arrayOf("Calm", "Confident", "Fearful", "Greedy", "Anxious")
                      AlertDialog.Builder(this@AddTradeActivity).setTitle("ইমোশন")
                          .setItems(opts) { _, i -> emotion = opts[i]; emotionLabel.text = emotion }.show()
                  }
                  form.addView(emotionLabel)
                  form.addView(lbl("স্ট্রাটেজি (ঐচ্ছিক)"))
                  val etStrat = inp("স্ট্রাটেজির নাম"); form.addView(etStrat)
                  form.addView(lbl("নোট (ঐচ্ছিক)"))
                  val etNotes = inp("মন্তব্য...", InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE)
                  etNotes.minLines = 2; form.addView(etNotes)

                  val saveBtn = TextView(this).apply {
                      text = "ট্রেড সেভ করুন"; textSize = 16f; setTextColor(Color.WHITE)
                      setTypeface(typeface, Typeface.BOLD); gravity = Gravity.CENTER
                      background = GradientDrawable(GradientDrawable.Orientation.TL_BR,
                          intArrayOf(Color.parseColor("#6366F1"), Color.parseColor("#8B5CF6"))
                      ).apply { cornerRadius = 36f }
                      setPadding(0, 40, 0, 40)
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = 24 }
                      setOnClickListener {
                          val pair = etPair.text.toString().trim().uppercase()
                          val entry = etEntry.text.toString().toDoubleOrNull()
                          val exit = etExit.text.toString().toDoubleOrNull()
                          val qty = etQty.text.toString().toDoubleOrNull()
                          if (pair.isBlank() || entry == null || exit == null || qty == null) {
                              Toast.makeText(this@AddTradeActivity, "সব ফিল্ড সঠিকভাবে পূরণ করুন", Toast.LENGTH_SHORT).show()
                              return@setOnClickListener
                          }
                          TradeStore(this@AddTradeActivity).add(Trade(
                              pair = pair, direction = direction, entry = entry, exit = exit, qty = qty,
                              date = selectedDate, notes = etNotes.text.toString().trim(),
                              account = "Default", strategy = etStrat.text.toString().trim(),
                              session = session, emotion = emotion
                          ))
                          Toast.makeText(this@AddTradeActivity, "সেভ হয়েছে", Toast.LENGTH_SHORT).show()
                          setResult(RESULT_OK); finish()
                      }
                  }
                  col.addView(header); col.addView(form); col.addView(saveBtn)
                  sv.addView(col); setContentView(sv)
              }

              private fun makeDirBtn(text: String, selected: Boolean): TextView = TextView(this).apply {
                  this.text = text; textSize = 14f; setTypeface(typeface, Typeface.BOLD); gravity = Gravity.CENTER
                  setPadding(0, 24, 0, 24)
                  background = GradientDrawable().apply {
                      cornerRadius = 20f; setColor(Color.parseColor(if (selected) "#6366F1" else "#F1F5F9"))
                  }
                  setTextColor(Color.parseColor(if (selected) "#FFFFFF" else "#64748B"))
              }

              private fun setDirection(d: String) {
                  direction = d
                  longBtn.background = GradientDrawable().apply {
                      cornerRadius = 20f; setColor(Color.parseColor(if (d=="LONG") "#6366F1" else "#F1F5F9"))
                  }
                  shortBtn.background = GradientDrawable().apply {
                      cornerRadius = 20f; setColor(Color.parseColor(if (d=="SHORT") "#6366F1" else "#F1F5F9"))
                  }
                  longBtn.setTextColor(Color.parseColor(if (d=="LONG") "#FFFFFF" else "#64748B"))
                  shortBtn.setTextColor(Color.parseColor(if (d=="SHORT") "#FFFFFF" else "#64748B"))
              }
          }
          AT_EOF

