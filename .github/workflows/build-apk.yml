          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import com.google.android.material.card.MaterialCardView
          import org.json.JSONArray
          import java.text.SimpleDateFormat
          import java.util.*

          class SettingsActivity : AppCompatActivity() {
              private lateinit var store: TradeStore
              private val saveCsv = registerForActivityResult(ActivityResultContracts.CreateDocument("text/csv")) { u ->
                  u?.let { saveTo(it, buildCsv(), "CSV") }
              }
              private val saveJson = registerForActivityResult(ActivityResultContracts.CreateDocument("application/json")) { u ->
                  u?.let { saveTo(it, buildJson(), "JSON") }
              }

              override fun onCreate(b: Bundle?) { super.onCreate(b); store = TradeStore(this); buildUi() }

              private fun buildUi() {
                  val sv = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#F8FAFC")) }
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(32, 48, 32, 32)
                  }
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, 0, 0, 20)
                  }
                  header.addView(TextView(this).apply {
                      text = "<"; textSize = 26f; setPadding(0, 0, 16, 4)
                      setTextColor(Color.parseColor("#0F172A"))
                      setOnClickListener { finish() }
                  })
                  header.addView(TextView(this).apply {
                      text = "ডেটা এক্সপোর্ট"; textSize = 22f
                      setTextColor(Color.parseColor("#0F172A"))
                      setTypeface(typeface, Typeface.BOLD)
                  })
                  val trades = store.all()
                  val ds = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.getDefault()).format(Date())

                  col.addView(header)
                  col.addView(actionCard("CSV","Google Drive-এ সেভ","${trades.size}টি ট্রেড · Drive বা Downloads","#10B981") {
                      saveCsv.launch("trading_master_$ds.csv")
                  })
                  col.addView(actionCard("JSON","JSON আকারে সেভ","ব্যাকআপ বা শেয়ার","#6366F1") {
                      saveJson.launch("trading_master_$ds.json")
                  })
                  col.addView(actionCard("X","সব ট্রেড মুছুন","${trades.size}টি ট্রেড স্থায়ীভাবে মুছে যাবে","#EF4444") {
                      AlertDialog.Builder(this).setTitle("নিশ্চিত?")
                          .setMessage("সব ট্রেড স্থায়ীভাবে মুছে যাবে।")
                          .setPositiveButton("হ্যাঁ, মুছুন") { _, _ ->
                              store.clear()
                              Toast.makeText(this, "সব মুছে ফেলা হয়েছে", Toast.LENGTH_SHORT).show(); finish()
                          }.setNegativeButton("বাতিল", null).show()
                  })
                  sv.addView(col); setContentView(sv)
              }

              private fun actionCard(icon: String, title: String, sub: String, colorHex: String, onClick: () -> Unit): MaterialCardView {
                  val c = MaterialCardView(this).apply {
                      radius = 24f; cardElevation = 3f
                      setCardBackgroundColor(Color.WHITE)
                      strokeWidth = 
