                          text = l.shortDesc; textSize = 12f
                          setTextColor(Color.parseColor("#64748B")); setPadding(0, 6, 0, 0)
                      })
                      card.addView(inner)
                      col.addView(card)
                  }
                  sv.addView(col); setContentView(sv)
              }
          }
