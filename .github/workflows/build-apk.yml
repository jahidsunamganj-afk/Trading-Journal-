                  val done = cs.countChecked(dailyItems)
                  val checkCard = MaterialCardView(this).apply {
                      radius = 32f; cardElevation = 4f
                      setCardBackgroundColor(Color.WHITE)
                      strokeWidth = 2; strokeColor = Color.parseColor("#E2E8F0")
