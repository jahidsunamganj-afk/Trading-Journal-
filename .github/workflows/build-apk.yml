                  val lessonsRead = lp.readCount(Content.lessons.map { it.id })
                  val bestPairName = Stats.bestPair(trades).first.ifBlank { "—" }
                  val qr = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 16 }
