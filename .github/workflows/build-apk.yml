name: Build Trading Master APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Scaffold project
        run: |
          mkdir -p app/src/main/java/com/tradingmaster/app
          mkdir -p app/src/main/res/values
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "TradingMaster"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          android.nonTransitiveRClass=false
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.tradingmaster.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.tradingmaster.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  debug { minifyEnabled false }
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Trading Master"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/Theme.TM"
                  android:allowBackup="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".AddTradeActivity" android:exported="false" android:theme="@style/Theme.TM"/>
                  <activity android:name=".SettingsActivity" android:exported="false" android:theme="@style/Theme.TM"/>
                  <activity android:name=".LessonListActivity" android:exported="false" android:theme="@style/Theme.TM"/>
                  <activity android:name=".LessonViewerActivity" android:exported="false" android:theme="@style/Theme.TM"/>
                  <activity android:name=".AnalyticsActivity" android:exported="false" android:theme="@style/Theme.TM"/>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.TM" parent="Theme.Material3.Light.NoActionBar">
                  <item name="colorPrimary">#6366F1</item>
                  <item name="colorOnPrimary">#FFFFFF</item>
                  <item name="colorSecondary">#8B5CF6</item>
                  <item name="colorSurface">#FFFFFF</item>
                  <item name="colorOnSurface">#0F172A</item>
                  <item name="android:windowBackground">#F8FAFC</item>
                  <item name="android:statusBarColor">#F8FAFC</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

      - name: Generate app icon
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
          python3 <<'PYEOF'
          import os
          from PIL import Image, ImageDraw
          sizes = {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for dpi, size in sizes.items():
              out = f'app/src/main/res/mipmap-{dpi}'
              os.makedirs(out, exist_ok=True)
              img = Image.new('RGBA', (size,size), (0,0,0,0))
              d = ImageDraw.Draw(img)
              for y in range(size):
                  t = y/max(size-1,1)
                  r = int(99+(139-99)*t); g = int(102+(92-102)*t); b = int(241+(246-241)*t)
                  d.line([(0,y),(size,y)], fill=(r,g,b,255))
              lw = max(size//24, 2)
              pts = [(size*0.2, size*0.72),(size*0.4, size*0.55),(size*0.6, size*0.62),(size*0.8, size*0.35)]
              d.line(pts, fill=(255,255,255,255), width=lw, joint='curve')
              ex,ey = pts[-1]; r = max(size//16, 3)
              d.ellipse([ex-r,ey-r,ex+r,ey+r], fill=(255,255,255,255))
              mask = Image.new('L', (size,size), 0)
              ImageDraw.Draw(mask).rounded_rectangle([(0,0),(size-1,size-1)], radius=max(size//6,2), fill=255)
              img.putalpha(mask)
              img.save(f'{out}/ic_launcher.png'); img.save(f'{out}/ic_launcher_round.png')
          print("Icons OK")
          PYEOF

      - name: Write Models
        run: |
          cat > app/src/main/java/com/tradingmaster/app/Models.kt <<'MODELS_EOF'
          package com.tradingmaster.app

          import org.json.JSONObject
          import java.util.UUID

          data class Trade(
              val id: String = UUID.randomUUID().toString(),
              val pair: String,
              val direction: String,
              val entry: Double,
              val exit: Double,
              val qty: Double,
              val date: Long,
              val notes: String = "",
              val account: String = "Default",
              val strategy: String = "",
              val session: String = "Asia",
              val emotion: String = "Calm",
              val confidence: Int = 3
          ) {
              val pnl: Double get() = if (direction == "LONG") (exit-entry)*qty else (entry-exit)*qty
              fun toJson() = JSONObject().apply {
                  put("id", id); put("pair", pair); put("direction", direction)
                  put("entry", entry); put("exit", exit); put("qty", qty); put("date", date)
                  put("notes", notes); put("account", account)
                  put("strategy", strategy); put("session", session)
                  put("emotion", emotion); put("confidence", confidence)
              }
              companion object {
                  fun fromJson(o: JSONObject) = Trade(
                      id = o.optString("id", UUID.randomUUID().toString()),
                      pair = o.optString("pair", ""),
                      direction = o.optString("direction", "LONG"),
                      entry = o.optDouble("entry", 0.0),
                      exit = o.optDouble("exit", 0.0),
                      qty = o.optDouble("qty", 0.0),
                      date = o.optLong("date", System.currentTimeMillis()),
                      notes = o.optString("notes", ""),
                      account = o.optString("account", "Default"),
                      strategy = o.optString("strategy", ""),
                      session = o.optString("session", "Asia"),
                      emotion = o.optString("emotion", "Calm"),
                      confidence = o.optInt("confidence", 3)
                  )
              }
          }

          data class Lesson(
              val id: String, val category: String, val title: String,
              val shortDesc: String, val content: String, val keyPoints: List<String>
          )

          data class ChecklistItem(val id: String, val text: String, val category: String)

          data class Strategy(
              val id: String = UUID.randomUUID().toString(),
              val name: String, val description: String,
              val entryRules: String, val exitRules: String, val timeframe: String = ""
          ) {
              fun toJson() = JSONObject().apply {
                  put("id", id); put("name", name); put("description", description)
                  put("entryRules", entryRules); put("exitRules", exitRules); put("timeframe", timeframe)
              }
              companion object {
                  fun fromJson(o: JSONObject) = Strategy(
                      id = o.optString("id", UUID.randomUUID().toString()),
                      name = o.optString("name", ""),
                      description = o.optString("description", ""),
                      entryRules = o.optString("entryRules", ""),
                      exitRules = o.optString("exitRules", ""),
                      timeframe = o.optString("timeframe", "")
                  )
              }
          }
          MODELS_EOF

      - name: Write Stores
        run: |
          cat > app/src/main/java/com/tradingmaster/app/Stores.kt <<'STORES_EOF'
          package com.tradingmaster.app

          import android.content.Context
          import org.json.JSONArray
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.*

          class TradeStore(ctx: Context) {
              private val file = File(ctx.applicationContext.filesDir, "trades.json")
              private val lock = Any()
              fun all(): List<Trade> = synchronized(lock) {
                  if (!file.exists()) return emptyList()
                  try {
                      val a = JSONArray(file.readText())
                      (0 until a.length()).map { Trade.fromJson(a.getJSONObject(it)) }
                  } catch (e: Exception) { emptyList() }
              }
              fun add(t: Trade) = synchronized(lock) { save(all()+t) }
              fun remove(id: String) = synchronized(lock) { save(all().filter { it.id != id }) }
              fun clear() = synchronized(lock) { file.delete() }
              private fun save(list: List<Trade>) {
                  val a = JSONArray(); list.forEach { a.put(it.toJson()) }
                  file.writeText(a.toString())
              }
          }

          class StrategyStore(ctx: Context) {
              private val file = File(ctx.applicationContext.filesDir, "strategies.json")
              private val lock = Any()
              fun all(): List<Strategy> = synchronized(lock) {
                  if (!file.exists()) return emptyList()
                  try {
                      val a = JSONArray(file.readText())
                      (0 until a.length()).map { Strategy.fromJson(a.getJSONObject(it)) }
                  } catch (e: Exception) { emptyList() }
              }
              fun add(s: Strategy) = synchronized(lock) { save(all()+s) }
              fun remove(id: String) = synchronized(lock) { save(all().filter { it.id != id }) }
              private fun save(list: List<Strategy>) {
                  val a = JSONArray(); list.forEach { a.put(it.toJson()) }
                  file.writeText(a.toString())
              }
          }

          class ChecklistStore(ctx: Context) {
              private val sp = ctx.applicationContext.getSharedPreferences("checklist", Context.MODE_PRIVATE)
              private fun todayKey() = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())
              fun isChecked(id: String) = sp.getBoolean(todayKey()+"_"+id, false)
              fun setChecked(id: String, v: Boolean) = sp.edit().putBoolean(todayKey()+"_"+id, v).apply()
              fun countChecked(items: List<ChecklistItem>): Int {
                  var c = 0
                  for (it in items) if (isChecked(it.id)) c++
                  return c
              }
          }

          class LessonProgressStore(ctx: Context) {
              private val sp = ctx.applicationContext.getSharedPreferences("lessons", Context.MODE_PRIVATE)
              fun isRead(id: String) = sp.getBoolean(id, false)
              fun markRead(id: String) = sp.edit().putBoolean(id, true).apply()
              fun readCount(ids: List<String>): Int {
                  var c = 0
                  for (id in ids) if (isRead(id)) c++
                  return c
              }
          }

          object Stats {
              fun totalPnl(t: List<Trade>) = t.sumOf { it.pnl }
              fun winRate(t: List<Trade>) = if (t.isEmpty()) 0.0 else t.count { it.pnl>0 }*100.0/t.size
              fun profitFactor(t: List<Trade>): Double {
                  val gp = t.filter { it.pnl>0 }.sumOf { it.pnl }
                  val gl = t.filter { it.pnl<0 }.sumOf { -it.pnl }
                  return if (gl==0.0) (if (gp>0) 99.99 else 0.0) else gp/gl
              }
              fun avgWin(t: List<Trade>): Double {
                  val w = t.filter { it.pnl>0 }
                  return if (w.isEmpty()) 0.0 else w.sumOf { it.pnl }/w.size
              }
              fun avgLoss(t: List<Trade>): Double {
                  val l = t.filter { it.pnl<0 }
                  return if (l.isEmpty()) 0.0 else l.sumOf { it.pnl }/l.size
              }
              fun equityCurve(t: List<Trade>): List<Double> {
                  val s = t.sortedBy { it.date }; val r = mutableListOf<Double>(); var run = 0.0
                  for (x in s) { run += x.pnl; r.add(run) }; return r
              }
              fun bestPair(t: List<Trade>): Pair<String, Double> {
                  val g = t.groupBy { it.pair }
                  return g.mapValues { it.value.sumOf { x -> x.pnl } }
                      .maxByOrNull { it.value }?.toPair() ?: ("" to 0.0)
              }
              fun worstPair(t: List<Trade>): Pair<String, Double> {
                  val g = t.groupBy { it.pair }
                  return g.mapValues { it.value.sumOf { x -> x.pnl } }
                      .minByOrNull { it.value }?.toPair() ?: ("" to 0.0)
              }
          }
          STORES_EOF

      - name: Write Chart
        run: |
          cat > app/src/main/java/com/tradingmaster/app/EquityChartView.kt <<'CHART_EOF'
          package com.tradingmaster.app

          import android.content.Context
          import android.graphics.*
          import android.view.View

          class EquityChartView(ctx: Context) : View(ctx) {
              private var data: List<Double> = emptyList()
              private val linePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#6366F1"); strokeWidth = 6f
                  style = Paint.Style.STROKE; strokeCap = Paint.Cap.ROUND; strokeJoin = Paint.Join.ROUND
              }
              private val dotPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#6366F1"); style = Paint.Style.FILL
              }
              private val dotBorder = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE; style = Paint.Style.FILL
              }
              private val gridPaint = Paint().apply {
                  color = Color.parseColor("#E2E8F0"); strokeWidth = 2f
              }
              private val zeroPaint = Paint().apply {
                  color = Color.parseColor("#CBD5E1"); strokeWidth = 3f
                  pathEffect = DashPathEffect(floatArrayOf(15f, 15f), 0f)
              }
              private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#94A3B8"); textSize = 32f
                  textAlign = Paint.Align.CENTER
              }
              fun setData(d: List<Double>) { data = d; invalidate() }
              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  if (data.isEmpty()) {
                      canvas.drawText("No data yet", width/2f, height/2f, textPaint); return
                  }
                  if (data.size == 1) {
                      canvas.drawText("Add more trades", width/2f, height/2f, textPaint); return
                  }
                  val w = width.toFloat(); val h = height.toFloat(); val p = 40f
                  val minV = minOf(data.min(), 0.0)
                  val maxV = maxOf(data.max(), 0.0)
                  val range = (maxV - minV).coerceAtLeast(1.0)
                  fun xf(i: Int) = p + (w - 2*p) * i / (data.size - 1).toFloat()
                  fun yf(v: Double) = h - p - ((v - minV) / range * (h - 2*p)).toFloat()
                  for (i in 0..4) {
                      val y = p + (h - 2*p) * i / 4f
                      canvas.drawLine(p, y, w - p, y, gridPaint)
                  }
                  if (minV < 0 && maxV > 0) {
                      canvas.drawLine(p, yf(0.0), w - p, yf(0.0), zeroPaint)
                  }
                  val path = Path().apply {
                      moveTo(xf(0), yf(data[0]))
                      for (i in 1 until data.size) lineTo(xf(i), yf(data[i]))
                  }
                  val fillPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      shader = LinearGradient(0f, p, 0f, h - p,
                          Color.parseColor("#506366F1"), Color.parseColor("#006366F1"),
                          Shader.TileMode.CLAMP)
                      style = Paint.Style.FILL
                  }
                  val fillPath = Path(path).apply {
                      lineTo(xf(data.size - 1), h - p)
                      lineTo(xf(0), h - p); close()
                  }
                  canvas.drawPath(fillPath, fillPaint)
                  canvas.drawPath(path, linePaint)
                  for (i in data.indices) {
                      val cx = xf(i); val cy = yf(data[i])
                      canvas.drawCircle(cx, cy, 9f, dotBorder)
                      canvas.drawCircle(cx, cy, 6f, dotPaint)
                  }
              }
          }
          CHART_EOF

      - name: Write Content
        run: |
          cat > app/src/main/java/com/tradingmaster/app/Content.kt <<'CONTENT_EOF'
