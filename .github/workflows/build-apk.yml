name: Build Trading Journal APK (Native)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Scaffold project
        run: |
          mkdir -p app/src/main/java/com/projournal/trading
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "TradingJournal"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          android.nonTransitiveRClass=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.projournal.trading'
              compileSdk 34
              defaultConfig {
                  applicationId "com.projournal.trading"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > app/proguard-rules.pro <<'EOF'
          -keep class com.projournal.trading.** { *; }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Trading Journal"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/Theme.TradingJournal"
                  android:allowBackup="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".AddTradeActivity" android:exported="false"
                      android:theme="@style/Theme.TradingJournal" />
                  <activity android:name=".SettingsActivity" android:exported="false"
                      android:theme="@style/Theme.TradingJournal" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.TradingJournal" parent="Theme.Material3.Light.NoActionBar">
                  <item name="colorPrimary">#6366F1</item>
                  <item name="colorOnPrimary">#FFFFFF</item>
                  <item name="colorSecondary">#8B5CF6</item>
                  <item name="colorSurface">#FFFFFF</item>
                  <item name="colorOnSurface">#0F172A</item>
                  <item name="android:windowBackground">#F8FAFC</item>
                  <item name="android:statusBarColor">#F8FAFC</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

      - name: Generate app icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil

          python3 <<'PYEOF'
          import os
          from PIL import Image, ImageDraw

          sizes = {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          TOP, BOTTOM = (99,102,241), (139,92,246)

          for dpi, size in sizes.items():
              out = f'app/src/main/res/mipmap-{dpi}'
              os.makedirs(out, exist_ok=True)
              img = Image.new('RGBA', (size,size), (0,0,0,0))
              d = ImageDraw.Draw(img)
              for y in range(size):
                  t = y/max(size-1,1)
                  r = int(TOP[0]+(BOTTOM[0]-TOP[0])*t)
                  g = int(TOP[1]+(BOTTOM[1]-TOP[1])*t)
                  b = int(TOP[2]+(BOTTOM[2]-TOP[2])*t)
                  d.line([(0,y),(size,y)], fill=(r,g,b,255))
              lw = max(size//24, 2)
              pts = [(size*0.2, size*0.72), (size*0.4, size*0.55),
                     (size*0.6, size*0.62), (size*0.8, size*0.35)]
              d.line(pts, fill=(255,255,255,255), width=lw, joint='curve')
              ex, ey = pts[-1]
              r = max(size//16, 3)
              d.ellipse([ex-r, ey-r, ex+r, ey+r], fill=(255,255,255,255))
              mask = Image.new('L', (size,size), 0)
              ImageDraw.Draw(mask).rounded_rectangle(
                  [(0,0),(size-1,size-1)], radius=max(size//6,2), fill=255)
              img.putalpha(mask)
              img.save(f'{out}/ic_launcher.png')
              img.save(f'{out}/ic_launcher_round.png')
          print("Icons generated")
          PYEOF
          ls -la app/src/main/res/mipmap-mdpi/

      - name: Write Trade model + storage
        run: |
          cat > app/src/main/java/com/projournal/trading/Trade.kt <<'EOF'
          package com.projournal.trading

          import org.json.JSONObject
          import java.util.UUID

          data class Trade(
              val id: String = UUID.randomUUID().toString(),
              val pair: String,
              val direction: String,
              val entry: Double,
              val exit: Double,
              val qty: Double,
              val date: Long,
              val notes: String = "",
              val account: String = "Default"
          ) {
              val pnl: Double get() =
                  if (direction == "LONG") (exit - entry) * qty else (entry - exit) * qty

              fun toJson(): JSONObject = JSONObject().apply {
                  put("id", id); put("pair", pair); put("direction", direction)
                  put("entry", entry); put("exit", exit); put("qty", qty)
                  put("date", date); put("notes", notes); put("account", account)
              }

              companion object {
                  fun fromJson(o: JSONObject) = Trade(
                      id = o.optString("id", UUID.randomUUID().toString()),
                      pair = o.getString("pair"),
                      direction = o.getString("direction"),
                      entry = o.getDouble("entry"),
                      exit = o.getDouble("exit"),
                      qty = o.getDouble("qty"),
                      date = o.getLong("date"),
                      notes = o.optString("notes", ""),
                      account = o.optString("account", "Default")
                  )
              }
          }
          EOF

          cat > app/src/main/java/com/projournal/trading/TradeStore.kt <<'EOF'
          package com.projournal.trading

          import android.content.Context
          import org.json.JSONArray
          import java.io.File

          class TradeStore(ctx: Context) {
              private val file = File(ctx.applicationContext.filesDir, "trades.json")
              private val lock = Any()

              fun all(): List<Trade> = synchronized(lock) {
                  if (!file.exists()) return emptyList()
                  try {
                      val arr = JSONArray(file.readText())
                      (0 until arr.length()).map { Trade.fromJson(arr.getJSONObject(it)) }
                  } catch (e: Exception) { emptyList() }
              }

              fun add(t: Trade) = synchronized(lock) {
                  val list = all().toMutableList(); list.add(t); save(list)
              }

              fun remove(id: String) = synchronized(lock) {
                  save(all().filter { it.id != id })
              }

              fun clear() = synchronized(lock) { file.delete() }

              private fun save(list: List<Trade>) {
                  val arr = JSONArray()
                  list.forEach { arr.put(it.toJson()) }
                  file.writeText(arr.toString())
              }
          }
          EOF

      - name: Write Stats + Chart view
        run: |
          cat > app/src/main/java/com/projournal/trading/Stats.kt <<'EOF'
          package com.projournal.trading

          object Stats {
              fun totalPnl(trades: List<Trade>) = trades.sumOf { it.pnl }
              fun winRate(trades: List<Trade>): Double =
                  if (trades.isEmpty()) 0.0
                  else trades.count { it.pnl > 0 } * 100.0 / trades.size
              fun profitFactor(trades: List<Trade>): Double {
                  val gp = trades.filter { it.pnl > 0 }.sumOf { it.pnl }
                  val gl = trades.filter { it.pnl < 0 }.sumOf { -it.pnl }
                  return if (gl == 0.0) (if (gp > 0) 99.99 else 0.0) else gp / gl
              }
              fun avgWin(trades: List<Trade>): Double {
                  val w = trades.filter { it.pnl > 0 }
                  return if (w.isEmpty()) 0.0 else w.sumOf { it.pnl } / w.size
              }
              fun avgLoss(trades: List<Trade>): Double {
                  val l = trades.filter { it.pnl < 0 }
                  return if (l.isEmpty()) 0.0 else l.sumOf { it.pnl } / l.size
              }
              fun equityCurve(trades: List<Trade>): List<Double> {
                  val sorted = trades.sortedBy { it.date }
                  val result = mutableListOf<Double>()
                  var run = 0.0
                  for (t in sorted) { run += t.pnl; result.add(run) }
                  return result
              }
          }
          EOF

          cat > app/src/main/java/com/projournal/trading/EquityChartView.kt <<'EOF'
          package com.projournal.trading

          import android.content.Context
          import android.graphics.*
          import android.view.View

          class EquityChartView(ctx: Context) : View(ctx) {
              private var data: List<Double> = emptyList()
              private val linePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#6366F1"); strokeWidth = 6f
                  style = Paint.Style.STROKE; strokeCap = Paint.Cap.ROUND
                  strokeJoin = Paint.Join.ROUND
              }
              private val dotPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#6366F1"); style = Paint.Style.FILL
              }
              private val dotBorder = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE; style = Paint.Style.FILL
              }
              private val gridPaint = Paint().apply {
                  color = Color.parseColor("#E2E8F0"); strokeWidth = 2f
              }
              private val zeroPaint = Paint().apply {
                  color = Color.parseColor("#CBD5E1"); strokeWidth = 3f
                  pathEffect = DashPathEffect(floatArrayOf(15f, 15f), 0f)
              }
              private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#94A3B8"); textSize = 30f
                  textAlign = Paint.Align.CENTER
              }

              fun setData(d: List<Double>) { data = d; invalidate() }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  if (data.isEmpty()) {
                      canvas.drawText("No data", width/2f, height/2f, textPaint)
                      return
                  }
                  if (data.size == 1) {
                      canvas.drawText("Add more trades", width/2f, height/2f, textPaint)
                      return
                  }
                  val w = width.toFloat(); val h = height.toFloat(); val p = 40f
                  val minV = minOf(data.min(), 0.0)
                  val maxV = maxOf(data.max(), 0.0)
                  val range = (maxV - minV).coerceAtLeast(1.0)
                  fun xf(i: Int) = p + (w - 2*p) * i / (data.size - 1).toFloat()
                  fun yf(v: Double) = h - p - ((v - minV) / range * (h - 2*p)).toFloat()

                  for (i in 0..4) {
                      val y = p + (h - 2*p) * i / 4f
                      canvas.drawLine(p, y, w - p, y, gridPaint)
                  }
                  if (minV < 0 && maxV > 0) {
                      val y = yf(0.0)
                      canvas.drawLine(p, y, w - p, y, zeroPaint)
                  }

                  val path = Path().apply {
                      moveTo(xf(0), yf(data[0]))
                      for (i in 1 until data.size) lineTo(xf(i), yf(data[i]))
                  }
                  val fillPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      shader = LinearGradient(0f, p, 0f, h - p,
                          Color.parseColor("#506366F1"),
                          Color.parseColor("#006366F1"),
                          Shader.TileMode.CLAMP)
                      style = Paint.Style.FILL
                  }
                  val fillPath = Path(path).apply {
                      lineTo(xf(data.size - 1), h - p)
                      lineTo(xf(0), h - p)
                      close()
                  }
                  canvas.drawPath(fillPath, fillPaint)
                  canvas.drawPath(path, linePaint)

                  for (i in data.indices) {
                      val cx = xf(i); val cy = yf(data[i])
                      canvas.drawCircle(cx, cy, 9f, dotBorder)
                      canvas.drawCircle(cx, cy, 6f, dotPaint)
                  }
              }
          }
          EOF

      - name: Write MainActivity
        run: |
          cat > app/src/main/java/com/projournal/trading/MainActivity.kt <<'EOF'
          package com.projournal.trading

          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.*
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.activity.result.contract.ActivityResultContracts
          import com.google.android.material.card.MaterialCardView
          import com.google.android.material.floatingactionbutton.ExtendedFloatingActionButton
          import java.text.SimpleDateFormat
          import java.util.*

          class MainActivity : AppCompatActivity() {
              private lateinit var store: TradeStore
              private lateinit var heroValue: TextView
              private lateinit var heroSub: TextView
              private lateinit var statsRow1: LinearLayout
              private lateinit var statsRow2: LinearLayout
              private lateinit var chartView: EquityChartView
              private lateinit var recentList: LinearLayout

              private val addLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()) { refreshUi() }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  store = TradeStore(this)
                  buildUi()
              }

              override fun onResume() { super.onResume(); refreshUi() }

              private fun buildUi() {
                  val root = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#F8FAFC")) }
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 60, 40, 200)
                  }

                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, 0, 0, 32)
                  }
                  val hCol = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                  }
                  hCol.addView(TextView(this).apply {
                      text = "Trading Journal"; textSize = 24f
                      setTextColor(Color.parseColor("#0F172A"))
                      setTypeface(typeface, Typeface.BOLD)
                  })
                  hCol.addView(TextView(this).apply {
                      text = "Your trades, your data"; textSize = 12f
                      setTextColor(Color.parseColor("#64748B"))
                      setPadding(0, 4, 0, 0)
                  })
                  header.addView(hCol)
                  header.addView(TextView(this).apply {
                      text = "Settings"; textSize = 14f
                      setTextColor(Color.parseColor("#6366F1"))
                      setTypeface(typeface, Typeface.BOLD)
                      setPadding(24, 12, 0, 12)
                      setOnClickListener { startActivity(Intent(this@MainActivity, SettingsActivity::class.java)) }
                  })

                  val hero = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 40, 48, 40)
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TL_BR,
                          intArrayOf(Color.parseColor("#6366F1"),
                                      Color.parseColor("#8B5CF6"),
                                      Color.parseColor("#EC4899"))
                      ).apply { cornerRadius = 52f }
                      elevation = 14f
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 32 }
                  }
                  hero.addView(TextView(this).apply {
                      text = "TOTAL P&L"; textSize = 12f
                      setTextColor(Color.WHITE); alpha = 0.85f
                      letterSpacing = 0.08f
                  })
                  heroValue = TextView(this).apply {
                      textSize = 36f; setTextColor(Color.WHITE)
                      setTypeface(typeface, Typeface.BOLD)
                      setPadding(0, 14, 0, 6)
                  }
                  hero.addView(heroValue)
                  heroSub = TextView(this).apply {
                      textSize = 13f; setTextColor(Color.WHITE); alpha = 0.9f
                  }
                  hero.addView(heroSub)

                  statsRow1 = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 8 }
                  }
                  statsRow2 = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 32 }
                  }

                  val chartSection = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = GradientDrawable().apply {
                          cornerRadius = 40f; setColor(Color.WHITE)
                          setStroke(2, Color.parseColor("#E2E8F0"))
                      }
                      setPadding(36, 32, 36, 32)
                      elevation = 3f
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 32 }
                  }
                  chartSection.addView(TextView(this).apply {
                      text = "Equity Curve"; textSize = 16f
                      setTextColor(Color.parseColor("#0F172A"))
                      setTypeface(typeface, Typeface.BOLD)
                      setPadding(0, 0, 0, 20)
                  })
                  chartView = EquityChartView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(-1, 420)
                  }
                  chartSection.addView(chartView)

                  val recentSection = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(-1, -2)
                  }
                  recentSection.addView(TextView(this).apply {
                      text = "Recent Trades"; textSize = 16f
                      setTextColor(Color.parseColor("#0F172A"))
                      setTypeface(typeface, Typeface.BOLD)
                      setPadding(8, 0, 0, 16)
                  })
                  recentList = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  recentSection.addView(recentList)

                  col.addView(header)
                  col.addView(hero)
                  col.addView(statsRow1)
                  col.addView(statsRow2)
                  col.addView(chartSection)
                  col.addView(recentSection)
                  root.addView(col)
                  setContentView(root)

                  val fabWrap = FrameLayout(this)
                  val fab = ExtendedFloatingActionButton(this).apply {
                      text = "New Trade"
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#6366F1"))
                      setIconResource(android.R.drawable.ic_input_add)
                      iconTint = android.content.res.ColorStateList.valueOf(Color.WHITE)
                      layoutParams = FrameLayout.LayoutParams(-2, -2).apply {
                          gravity = Gravity.BOTTOM or Gravity.END
                          setMargins(0, 0, 40, 48)
                      }
                      setOnClickListener {
                          addLauncher.launch(Intent(this@MainActivity, AddTradeActivity::class.java))
                      }
                  }
                  fabWrap.addView(fab)
                  addContentView(fabWrap, LinearLayout.LayoutParams(-1, -1))
              }

              private fun refreshUi() {
                  if (!::heroValue.isInitialized) return
                  val trades = store.all()
                  val pnl = Stats.totalPnl(trades)
                  val wr = Stats.winRate(trades)
                  val pf = Stats.profitFactor(trades)

                  heroValue.text = (if (pnl >= 0) "+\$" else "-\$") +
                          String.format(Locale.US, "%.2f", Math.abs(pnl))
                  heroSub.text = "${trades.size} trades - Win rate ${String.format(Locale.US, "%.1f", wr)}%"

                  statsRow1.removeAllViews()
                  statsRow2.removeAllViews()
                  statsRow1.addView(statCard("Win Rate", "${String.format(Locale.US, "%.1f", wr)}%", "#10B981"))
                  statsRow1.addView(statCard("Profit Factor", String.format(Locale.US, "%.2f", pf), "#F59E0B"))
                  statsRow2.addView(statCard("Avg Win", "\$${String.format(Locale.US, "%.1f", Stats.avgWin(trades))}", "#3B82F6"))
                  statsRow2.addView(statCard("Avg Loss", "\$${String.format(Locale.US, "%.1f", Stats.avgLoss(trades))}", "#EF4444"))

                  chartView.setData(Stats.equityCurve(trades))

                  recentList.removeAllViews()
                  if (trades.isEmpty()) {
                      recentList.addView(TextView(this).apply {
                          text = "No trades yet\n\nTap + to add your first trade"
                          textSize = 14f; gravity = Gravity.CENTER
                          setTextColor(Color.parseColor("#94A3B8"))
                          setPadding(0, 80, 0, 80)
                      })
                  } else {
                      trades.sortedByDescending { it.date }.take(5).forEach { t ->
                          recentList.addView(tradeRow(t))
                      }
                  }
              }

              private fun statCard(label: String, value: String, colorHex: String): MaterialCardView {
                  val card = MaterialCardView(this).apply {
                      radius = 32f; cardElevation = 3f
                      setCardBackgroundColor(Color.WHITE)
                      strokeWidth = 2
                      strokeColor = Color.parseColor("#E2E8F0")
                      layoutParams = LinearLayout.LayoutParams(0, -2).apply {
                          weight = 1f
                          setMargins(8, 8, 8, 8)
                      }
                  }
                  val inner = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 28, 32, 28)
                  }
                  inner.addView(LinearLayout(this).apply {
                      background = GradientDrawable().apply {
                          cornerRadius = 8f; setColor(Color.parseColor(colorHex))
                      }
                      layoutParams = LinearLayout.LayoutParams(48, 8).apply { bottomMargin = 16 }
                  })
                  inner.addView(TextView(this).apply {
                      text = value; textSize = 20f
                      setTextColor(Color.parseColor("#0F172A"))
                      setTypeface(typeface, Typeface.BOLD)
                  })
                  inner.addView(TextView(this).apply {
                      text = label; textSize = 12f
                      setTextColor(Color.parseColor("#64748B"))
                      setPadding(0, 6, 0, 0)
                  })
                  card.addView(inner)
                  return card
              }

              private fun tradeRow(t: Trade): MaterialCardView {
                  val win = t.pnl >= 0
                  val card = MaterialCardView(this).apply {
                      radius = 28f; cardElevation = 2f
                      setCardBackgroundColor(Color.WHITE)
                      strokeWidth = 1
                      strokeColor = Color.parseColor("#E2E8F0")
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 12 }
                      isClickable = true; isFocusable = true
                      setOnClickListener { showTradeDialog(t) }
                  }
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(32, 28, 32, 28)
                  }
                  val iconBox = LinearLayout(this).apply {
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.parseColor(if (win) "#DCFCE7" else "#FEE2E2"))
                      }
                      layoutParams = LinearLayout.LayoutParams(96, 96).apply { rightMargin = 28 }
                      gravity = Gravity.CENTER
                  }
                  iconBox.addView(TextView(this).apply {
                      text = if (win) "+" else "-"; textSize = 36f; gravity = Gravity.CENTER
                      setTextColor(Color.parseColor(if (win) "#10B981" else "#EF4444"))
                      setTypeface(typeface, Typeface.BOLD)
                  })
                  row.addView(iconBox)
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                  }
                  col.addView(TextView(this).apply {
                      text = "${t.pair} - ${t.direction}"; textSize = 15f
                      setTextColor(Color.parseColor("#0F172A"))
                      setTypeface(typeface, Typeface.BOLD)
                  })
                  col.addView(TextView(this).apply {
                      text = "${SimpleDateFormat("dd MMM yyyy", Locale.getDefault()).format(Date(t.date))} - ${t.account}"
                      textSize = 11f; setTextColor(Color.parseColor("#64748B"))
                      setPadding(0, 4, 0, 0)
                  })
                  col.addView(TextView(this).apply {
                      text = "Entry ${t.entry} to Exit ${t.exit}"
                      textSize = 11f; setTextColor(Color.parseColor("#94A3B8"))
                      setPadding(0, 2, 0, 0)
                  })
                  row.addView(col)
                  row.addView(TextView(this).apply {
                      text = (if (win) "+" else "-") + "\$" + String.format(Locale.US, "%.2f", Math.abs(t.pnl))
                      textSize = 15f
                      setTextColor(Color.parseColor(if (win) "#10B981" else "#EF4444"))
                      setTypeface(typeface, Typeface.BOLD)
                  })
                  card.addView(row)
                  return card
              }

              private fun showTradeDialog(t: Trade) {
                  val dlg = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 32, 48, 0)
                  }
                  fun addLabel(l: String, v: String) {
                      dlg.addView(TextView(this).apply {
                          text = l; textSize = 12f
                          setTextColor(Color.parseColor("#64748B"))
                          setPadding(0, 12, 0, 2)
                      })
                      dlg.addView(TextView(this).apply {
                          text = v; textSize = 15f
                          setTextColor(Color.parseColor("#0F172A"))
                          setTypeface(typeface, Typeface.BOLD)
                      })
                  }
                  addLabel("Pair", t.pair)
                  addLabel("Direction", t.direction)
                  addLabel("Entry to Exit", "${t.entry} to ${t.exit}")
                  addLabel("Qty", t.qty.toString())
                  addLabel("P&L", (if (t.pnl >= 0) "+" else "") + "\$" + String.format(Locale.US, "%.2f", t.pnl))
                  if (t.notes.isNotBlank()) addLabel("Notes", t.notes)

                  AlertDialog.Builder(this)
                      .setTitle("Trade Details")
                      .setView(dlg)
                      .setPositiveButton("Close", null)
                      .setNegativeButton("Delete") { _, _ ->
                          store.remove(t.id); refreshUi()
                      }.show()
              }
          }
          EOF

      - name: Write AddTradeActivity
        run: |
          cat > app/src/main/java/com/projournal/trading/AddTradeActivity.kt <<'EOF'
          package com.projournal.trading

          import android.app.DatePickerDialog
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.text.InputType
          import android.view.Gravity
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import java.text.SimpleDateFormat
          import java.util.*

          class AddTradeActivity : AppCompatActivity() {
              private var direction = "LONG"
              private var selectedDate = System.currentTimeMillis()
              private lateinit var longBtn: TextView
              private lateinit var shortBtn: TextView
              private lateinit var dateLabel: TextView

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  buildUi()
              }

              private fun buildUi() {
                  val root = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#F8FAFC")) }
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 60, 40, 40)
                  }

                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, 0, 0, 32)
                  }
                  header.addView(TextView(this).apply {
                      text = "<"; textSize = 28f; setPadding(0, 0, 20, 4)
                      setTextColor(Color.parseColor("#0F172A"))
                      setOnClickListener { finish() }
                  })
                  header.addView(TextView(this).apply {
                      text = "New Trade"; textSize = 22f
                      setTextColor(Color.parseColor("#0F172A"))
                      setTypeface(typeface, Typeface.BOLD)
                  })

                  val formCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = GradientDrawable().apply {
                          cornerRadius = 40f; setColor(Color.WHITE)
                          setStroke(2, Color.parseColor("#E2E8F0"))
                      }
                      setPadding(40, 36, 40, 36)
                      elevation = 3f
                  }

                  fun label(t: String) = TextView(this).apply {
                      text = t; textSize = 13f
                      setTextColor(Color.parseColor("#0F172A"))
                      setTypeface(typeface, Typeface.BOLD)
                      setPadding(0, 20, 0, 10)
                  }
                  fun input(hint: String, inputType: Int = InputType.TYPE_CLASS_TEXT) =
                      EditText(this).apply {
                          this.hint = hint
                          this.inputType = inputType
                          setBackgroundColor(Color.parseColor("#F1F5F9"))
                          setPadding(32, 28, 32, 28)
                          textSize = 15f
                      }

                  formCard.addView(label("Pair"))
                  val etPair = input("e.g. BTC/USDT")
                  formCard.addView(etPair)

                  formCard.addView(label("Direction"))
                  val dirRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, 0, 0, 8)
                  }
                  longBtn = makeDirBtn("LONG", true)
                  shortBtn = makeDirBtn("SHORT", false)
                  longBtn.setOnClickListener { setDirection("LONG") }
                  shortBtn.setOnClickListener { setDirection("SHORT") }
                  dirRow.addView(longBtn, LinearLayout.LayoutParams(0, -2, 1f).apply { setMargins(0, 0, 8, 0) })
                  dirRow.addView(shortBtn, LinearLayout.LayoutParams(0, -2, 1f).apply { setMargins(8, 0, 0, 0) })
                  formCard.addView(dirRow)

                  formCard.addView(label("Entry Price"))
                  val etEntry = input("0.00", InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL)
                  formCard.addView(etEntry)

                  formCard.addView(label("Exit Price"))
                  val etExit = input("0.00", InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL)
                  formCard.addView(etExit)

                  formCard.addView(label("Quantity"))
                  val etQty = input("0.00", InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL)
                  formCard.addView(etQty)

                  formCard.addView(label("Date"))
                  dateLabel = TextView(this).apply {
                      text = SimpleDateFormat("dd MMM yyyy", Locale.getDefault()).format(Date(selectedDate))
                      textSize = 15f; setTextColor(Color.parseColor("#0F172A"))
                      background = GradientDrawable().apply {
                          cornerRadius = 16f; setColor(Color.parseColor("#F1F5F9"))
                      }
                      setPadding(32, 28, 32, 28)
                      setOnClickListener {
                          val cal = Calendar.getInstance().apply { timeInMillis = selectedDate }
                          DatePickerDialog(this@AddTradeActivity,
                              { _, y, m, d ->
                                  cal.set(y, m, d); selectedDate = cal.timeInMillis
                                  dateLabel.text = SimpleDateFormat("dd MMM yyyy", Locale.getDefault()).format(Date(selectedDate))
                              },
                              cal.get(Calendar.YEAR), cal.get(Calendar.MONTH), cal.get(Calendar.DAY_OF_MONTH)
                          ).show()
                      }
                  }
                  formCard.addView(dateLabel)

                  formCard.addView(label("Account"))
                  val etAcc = input("Default")
                  etAcc.setText("Default")
                  formCard.addView(etAcc)

                  formCard.addView(label("Notes (optional)"))
                  val etNotes = input("Strategy, emotion...", InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE)
                  etNotes.minLines = 2
                  formCard.addView(etNotes)

                  val saveBtn = TextView(this).apply {
                      text = "Save Trade"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      setTypeface(typeface, Typeface.BOLD)
                      gravity = Gravity.CENTER
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TL_BR,
                          intArrayOf(Color.parseColor("#6366F1"), Color.parseColor("#8B5CF6"))
                      ).apply { cornerRadius = 40f }
                      setPadding(0, 44, 0, 44)
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = 40 }
                      setOnClickListener {
                          val pair = etPair.text.toString().trim().uppercase()
                          val entry = etEntry.text.toString().toDoubleOrNull()
                          val exit = etExit.text.toString().toDoubleOrNull()
                          val qty = etQty.text.toString().toDoubleOrNull()
                          if (pair.isBlank()) {
                              Toast.makeText(this@AddTradeActivity, "Enter pair", Toast.LENGTH_SHORT).show(); return@setOnClickListener
                          }
                          if (entry == null || exit == null || qty == null) {
                              Toast.makeText(this@AddTradeActivity, "Enter valid numbers", Toast.LENGTH_SHORT).show(); return@setOnClickListener
                          }
                          val trade = Trade(
                              pair = pair, direction = direction,
                              entry = entry, exit = exit, qty = qty,
                              date = selectedDate,
                              notes = etNotes.text.toString().trim(),
                              account = etAcc.text.toString().trim().ifBlank { "Default" }
                          )
                          TradeStore(this@AddTradeActivity).add(trade)
                          Toast.makeText(this@AddTradeActivity, "Saved!", Toast.LENGTH_SHORT).show()
                          setResult(RESULT_OK); finish()
                      }
                  }

                  col.addView(header)
                  col.addView(formCard)
                  col.addView(saveBtn)
                  root.addView(col)
                  setContentView(root)
              }

              private fun makeDirBtn(text: String, selected: Boolean): TextView {
                  return TextView(this).apply {
                      this.text = text; textSize = 14f
                      setTypeface(typeface, Typeface.BOLD)
                      gravity = Gravity.CENTER
                      setPadding(0, 28, 0, 28)
                      background = GradientDrawable().apply {
                          cornerRadius = 24f
                          setColor(Color.parseColor(if (selected) "#6366F1" else "#F1F5F9"))
                      }
                      setTextColor(Color.parseColor(if (selected) "#FFFFFF" else "#64748B"))
                  }
              }

              private fun setDirection(d: String) {
                  direction = d
                  val lg = GradientDrawable().apply {
                      cornerRadius = 24f
                      setColor(Color.parseColor(if (d == "LONG") "#6366F1" else "#F1F5F9"))
                  }
                  val sg = GradientDrawable().apply {
                      cornerRadius = 24f
                      setColor(Color.parseColor(if (d == "SHORT") "#6366F1" else "#F1F5F9"))
                  }
                  longBtn.background = lg
                  shortBtn.background = sg
                  longBtn.setTextColor(Color.parseColor(if (d == "LONG") "#FFFFFF" else "#64748B"))
                  shortBtn.setTextColor(Color.parseColor(if (d == "SHORT") "#FFFFFF" else "#64748B"))
              }
          }
          EOF

      - name: Write SettingsActivity
        run: |
          cat > app/src/main/java/com/projournal/trading/SettingsActivity.kt <<'EOF'
          package com.projournal.trading

          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import com.google.android.material.card.MaterialCardView
          import org.json.JSONArray
          import java.text.SimpleDateFormat
          import java.util.*

          class SettingsActivity : AppCompatActivity() {
              private lateinit var store: TradeStore

              private val saveCsvLauncher = registerForActivityResult(
                  ActivityResultContracts.CreateDocument("text/csv")) { uri ->
                  uri?.let { saveTo(it, buildCsv(), "CSV") }
              }
              private val saveJsonLauncher = registerForActivityResult(
                  ActivityResultContracts.CreateDocument("application/json")) { uri ->
                  uri?.let { saveTo(it, buildJson(), "JSON") }
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  store = TradeStore(this)
                  buildUi()
              }

              private fun buildUi() {
                  val root = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#F8FAFC")) }
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 60, 40, 40)
                  }

                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, 0, 0, 32)
                  }
                  header.addView(TextView(this).apply {
                      text = "<"; textSize = 28f; setPadding(0, 0, 20, 4)
                      setTextColor(Color.parseColor("#0F172A"))
                      setOnClickListener { finish() }
                  })
                  header.addView(TextView(this).apply {
                      text = "Settings"; textSize = 22f
                      setTextColor(Color.parseColor("#0F172A"))
                      setTypeface(typeface, Typeface.BOLD)
                  })

                  fun section(t: String) = TextView(this).apply {
                      text = t; textSize = 13f
                      setTextColor(Color.parseColor("#64748B"))
                      setTypeface(typeface, Typeface.BOLD)
                      setPadding(8, 24, 8, 12)
                      letterSpacing = 0.05f
                  }

                  fun actionCard(icon: String, title: String, subtitle: String, colorHex: String, onClick: () -> Unit): MaterialCardView {
                      val card = MaterialCardView(this).apply {
                          radius = 28f; cardElevation = 3f
                          strokeWidth = 1; strokeColor = Color.parseColor("#E2E8F0")
                          setCardBackgroundColor(Color.WHITE)
                          layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 12 }
                          setOnClickListener { onClick() }; isClickable = true; isFocusable = true
                      }
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(36, 32, 36, 32)
                      }
                      val iconBox = LinearLayout(this).apply {
                          background = GradientDrawable().apply {
                              cornerRadius = 28f; setColor(Color.parseColor(colorHex))
                          }
                          layoutParams = LinearLayout.LayoutParams(88, 88).apply { rightMargin = 28 }
                          gravity = Gravity.CENTER
                      }
                      iconBox.addView(TextView(this).apply {
                          text = icon; textSize = 24f; gravity = Gravity.CENTER
                          setTextColor(Color.WHITE); setTypeface(typeface, Typeface.BOLD)
                      })
                      row.addView(iconBox)
                      val c = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                      }
                      c.addView(TextView(this).apply {
                          text = title; textSize = 15f
                          setTextColor(Color.parseColor("#0F172A"))
                          setTypeface(typeface, Typeface.BOLD)
                      })
                      c.addView(TextView(this).apply {
                          text = subtitle; textSize = 12f
                          setTextColor(Color.parseColor("#64748B"))
                          setPadding(0, 4, 0, 0)
                      })
                      row.addView(c)
                      row.addView(TextView(this).apply {
                          text = ">"; textSize = 20f; setTextColor(Color.parseColor("#94A3B8"))
                      })
                      card.addView(row)
                      return card
                  }

                  val trades = store.all()
                  val dateStr = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.getDefault()).format(Date())

                  col.addView(header)
                  col.addView(section("EXPORT DATA"))
                  col.addView(actionCard("CSV", "Save to Google Drive",
                      "${trades.size} trades - choose Drive or Downloads", "#10B981") {
                      saveCsvLauncher.launch("trading_journal_$dateStr.csv")
                  })
                  col.addView(actionCard("JSON", "Save as JSON",
                      "For backup or sharing", "#6366F1") {
                      saveJsonLauncher.launch("trading_journal_$dateStr.json")
                  })
                  col.addView(section("DATA MANAGEMENT"))
                  col.addView(actionCard("X", "Delete all trades",
                      "${trades.size} trades will be removed", "#EF4444") {
                      AlertDialog.Builder(this)
                          .setTitle("Confirm?")
                          .setMessage("All trades will be permanently deleted.")
                          .setPositiveButton("Yes, delete") { _, _ ->
                              store.clear()
                              Toast.makeText(this, "All trades cleared", Toast.LENGTH_SHORT).show()
                              finish()
                          }
                          .setNegativeButton("Cancel", null).show()
                  })
                  col.addView(section("ABOUT"))
                  col.addView(actionCard("i", "Trading Journal v1.0",
                      "Your personal trading tracker", "#8B5CF6") {})
                  root.addView(col)
                  setContentView(root)
              }

              private fun buildCsv(): String {
                  val trades = store.all().sortedBy { it.date }
                  val sb = StringBuilder()
                  sb.append('\uFEFF')
                  sb.append("Date,Pair,Direction,Entry,Exit,Qty,P&L,Account,Notes\n")
                  val fmt = SimpleDateFormat("yyyy-MM-dd", Locale.getDefault())
                  trades.forEach { t ->
                      sb.append(fmt.format(Date(t.date))).append(',')
                      sb.append(esc(t.pair)).append(',')
                      sb.append(t.direction).append(',')
                      sb.append(t.entry).append(',')
                      sb.append(t.exit).append(',')
                      sb.append(t.qty).append(',')
                      sb.append(String.format(Locale.US, "%.2f", t.pnl)).append(',')
                      sb.append(esc(t.account)).append(',')
                      sb.append(esc(t.notes)).append('\n')
                  }
                  return sb.toString()
              }

              private fun buildJson(): String {
                  val arr = JSONArray()
                  store.all().forEach { arr.put(it.toJson()) }
                  return arr.toString(2)
              }

              private fun esc(s: String) = "\"" + s.replace("\"", "\"\"").replace("\n", " ") + "\""

              private fun saveTo(uri: android.net.Uri, content: String, type: String) {
                  try {
                      contentResolver.openOutputStream(uri)?.use { it.write(content.toByteArray()) }
                      Toast.makeText(this, "$type saved", Toast.LENGTH_LONG).show()
                  } catch (e: Exception) {
                      Toast.makeText(this, "Save failed: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }
          }
          EOF

